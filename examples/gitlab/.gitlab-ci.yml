# Example .gitlab-ci.yml. It uploads to a CybeDefend AppSec Community Edition
# instance (CybeDefend Cloud does not take imports).
#
# Set CYBEDEFEND_API_URL, CYBEDEFEND_PROJECT_ID and CYBEDEFEND_TOKEN (masked)
# in Settings > CI/CD > Variables; never put the token in this file. Replace
# <commit-sha> with the full commit sha of the release you use (a tag can be
# moved), and set CYBEDEFEND_SCANNERS_VERSION to that release, such as 1.0.0.
include:
  - remote: https://raw.githubusercontent.com/CybeDefend/cybedefend-scanners/<commit-sha>/templates/gitlab/appsec-scanners.gitlab-ci.yml

stages: [build, test]

variables:
  CYBEDEFEND_SCANNERS_VERSION: "1"

cybedefend-sast:
  extends: .cybedefend-sast

cybedefend-secret:
  extends: .cybedefend-secret

cybedefend-iac:
  extends: .cybedefend-iac

cybedefend-cicd:
  extends: .cybedefend-cicd

cybedefend-sca:
  extends: .cybedefend-sca

# Scans the image an earlier job pushed to the project's registry.
cybedefend-container:
  extends: .cybedefend-container
  needs: [build-image]
  variables:
    CYBEDEFEND_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build-image:
  stage: build
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
