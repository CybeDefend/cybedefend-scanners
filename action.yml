name: CybeDefend AppSec scanners
description: >-
  Run one open-source security scanner (Opengrep, Gitleaks, Trivy, zizmor) in
  its container image, normalise its SARIF and upload it to the import route of
  a CybeDefend instance.
author: CybeDefend
branding:
  icon: shield
  color: purple

inputs:
  scanner:
    description: >-
      The scanner to run: opengrep (sast), gitleaks (secret), trivy-config
      (iac), zizmor (cicd), trivy-fs (sca) or trivy-image (container). sca and
      container imports are accepted by a Community Edition instance only.
      zizmor runs its online audits only when the step's env sets GH_TOKEN to
      the workflow's github.token.
    required: true
  project-id:
    description: The CybeDefend project the results are imported into.
    required: true
  image:
    description: >-
      The image reference trivy-image scans and uploads, as
      registry/name[:tag][@sha256:digest]. Required for trivy-image, refused for
      the other scanners. An image built earlier in the job is saved and
      scanned locally; any other is pulled by Trivy, with TRIVY_USERNAME and
      TRIVY_PASSWORD from the step's env when the registry needs them.
    required: false
    default: ''
  api-url:
    description: >-
      The instance's API URL, such as https://appsec.example.com/api (the
      Community Edition serves its API under /api).
    required: true
  token:
    description: >-
      A personal access token of a user with the start_scan permission on the
      project. Pass it from a secret, such as secrets.CYBEDEFEND_TOKEN.
    required: true
  branch:
    description: >-
      The branch the results belong to. Defaults to the pull request's head
      branch, else the branch or tag that triggered the run.
    required: false
    default: ''
  path:
    description: >-
      The directory to scan, relative to the workspace. trivy-fs (sca) must
      scan the repository root, the default: an sca import is the branch's
      whole dependency picture, and every package it does not report is
      resolved. trivy-image ignores it.
    required: false
    default: '.'
  version:
    description: >-
      The scanner image version (ghcr.io/cybedefend/appsec-scanners-<scanner>:<version>).
      Defaults to the tag this action is used at, without its leading v. Set it
      when the action is pinned by commit sha.
    required: false
    default: ''
  upload:
    description: Upload the SARIF to the instance (true) or only write it (false).
    required: false
    default: 'true'
  sarif-output:
    description: >-
      The file name of the normalised SARIF, written in the runner's temporary
      directory; the sarif-file output gives its path, for
      github/codeql-action/upload-sarif. Defaults to cybedefend-<scanner>.sarif.
    required: false
    default: ''

outputs:
  sarif-file:
    description: The path of the normalised SARIF on the runner.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Check the image of trivy-image
      if: inputs.scanner == 'trivy-image' && inputs.image == ''
      shell: bash
      run: |
        echo "::error title=CybeDefend::trivy-image needs the image input: the reference of the image to scan."
        exit 1

    - name: Check the inputs
      id: inputs
      shell: bash
      env:
        SCANNER: ${{ inputs.scanner }}
        IMAGE: ${{ inputs.image }}
        BRANCH: ${{ inputs.branch }}
        SCAN_PATH: ${{ inputs.path }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        UPLOAD: ${{ inputs.upload }}
        SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=CybeDefend::$1"; exit 1; }

        case "$SCANNER" in
          opengrep|gitleaks|trivy-config|zizmor|trivy-fs|trivy-image) ;;
          *) fail "scanner must be one of opengrep, gitleaks, trivy-config, zizmor, trivy-fs, trivy-image." ;;
        esac

        if [ "$SCANNER" = trivy-image ]; then
          [[ "$IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]{0,254}$ ]] ||
            fail "image must be registry/name[:tag][@sha256:digest], 255 characters at most."
        elif [ -n "$IMAGE" ]; then
          fail "the image input is used by trivy-image only."
        fi

        case "$UPLOAD" in
          true|false) ;;
          *) fail "upload must be true or false." ;;
        esac

        if [ -z "$BRANCH" ]; then
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        fi
        if [ "$UPLOAD" = true ] && [ -z "$BRANCH" ]; then
          fail "no branch: set the branch input."
        fi
        case "$BRANCH" in
          *$'\n'*|*$'\r'*) fail "the branch must be a single line." ;;
        esac

        if [ -z "$VERSION" ]; then
          VERSION="${ACTION_REF#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] ||
            fail "the action is not used at a version tag: set the version input, such as 1.2.0."
        fi
        [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || fail "version must be an image tag, such as 1.2.0."

        if [ -z "$SARIF_OUTPUT" ]; then
          SARIF_OUTPUT="cybedefend-$SCANNER.sarif"
        fi
        [[ "$SARIF_OUTPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] ||
          fail "sarif-output must be a file name, without a directory."

        workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        src="$(cd "$workspace/$SCAN_PATH" 2>/dev/null && pwd -P)" || fail "path must be a directory of the workspace."
        case "$src/" in
          "$workspace"/*) ;;
          *) fail "path must stay inside the workspace." ;;
        esac
        if [ "$SCANNER" = trivy-fs ] && [ "$src" != "$workspace" ]; then
          echo "::warning title=CybeDefend::trivy-fs scans $SCAN_PATH, not the repository root: the import resolves every package of the branch it does not report."
        fi

        {
          echo "branch=$BRANCH"
          echo "version=$VERSION"
          echo "sarif-output=$SARIF_OUTPUT"
          echo "source=$src"
        } >> "$GITHUB_OUTPUT"

    - name: Save a local image for trivy-image
      id: archive
      if: inputs.scanner == 'trivy-image'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # A directory uid 65532 (the scanner) can read; nothing else is in it.
        work="$(mktemp -d "$RUNNER_TEMP/cybedefend-XXXXXX")"
        chmod 0755 "$work"
        echo "dir=$work" >> "$GITHUB_OUTPUT"
        if docker image inspect "$IMAGE" > /dev/null 2>&1; then
          docker save -o "$work/cybedefend-image.tar" "$IMAGE"
          chmod 0644 "$work/cybedefend-image.tar"
          echo "archive=/out/cybedefend-image.tar" >> "$GITHUB_OUTPUT"
          echo "Scanning the local image, saved with docker save."
        else
          echo "The image is not on the runner: Trivy pulls it."
        fi

    - name: Run the scanner
      id: scan
      shell: bash
      env:
        SCANNER: ${{ inputs.scanner }}
        UPLOAD: ${{ inputs.upload }}
        VERSION: ${{ steps.inputs.outputs.version }}
        SARIF_OUTPUT: ${{ steps.inputs.outputs.sarif-output }}
        SOURCE: ${{ steps.inputs.outputs.source }}
        ARCHIVE_DIR: ${{ steps.archive.outputs.dir }}
        ARCHIVE: ${{ steps.archive.outputs.archive }}
        CYBEDEFEND_API_URL: ${{ inputs.api-url }}
        CYBEDEFEND_TOKEN: ${{ inputs.token }}
        CYBEDEFEND_PROJECT_ID: ${{ inputs.project-id }}
        CYBEDEFEND_BRANCH: ${{ steps.inputs.outputs.branch }}
        CYBEDEFEND_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        name="cybedefend-$SCANNER-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-$RANDOM"
        out_dir="$(mktemp -d "$RUNNER_TEMP/cybedefend-sarif-XXXXXX")"
        cleanup() {
          docker rm -f "$name" > /dev/null 2>&1 || true
          if [ -n "$ARCHIVE_DIR" ]; then rm -rf "$ARCHIVE_DIR"; fi
        }
        trap cleanup EXIT

        # Variables are forwarded by name: their values, the token among them,
        # never appear on a command line.
        # The default network, never the host's: on a self-hosted runner that
        # would open every service on its localhost to the scanner.
        # host.docker.internal names the runner, for an API it serves itself.
        args=(run --name "$name" --add-host host.docker.internal:host-gateway
          -v "$SOURCE:/src:ro"
          -e CYBEDEFEND_API_URL -e CYBEDEFEND_TOKEN -e CYBEDEFEND_PROJECT_ID -e CYBEDEFEND_BRANCH)
        case "$SCANNER" in
          trivy-image)
            if [ -n "$ARCHIVE" ]; then
              export IMAGE_ARCHIVE="$ARCHIVE"
              args+=(-v "$ARCHIVE_DIR:/out:ro")
            fi
            args+=(-e CYBEDEFEND_IMAGE -e IMAGE_ARCHIVE -e TRIVY_USERNAME -e TRIVY_PASSWORD
              -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY) ;;
          trivy-fs) args+=(-e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY) ;;
          zizmor) args+=(-e GH_TOKEN) ;;
        esac
        # The SARIF is written inside the container (uid 65532) and copied out
        # with docker cp, which gives the runner's user a file it can read.
        args+=("ghcr.io/cybedefend/appsec-scanners-$SCANNER:$VERSION" --out "/tmp/appsec-scanner/$SARIF_OUTPUT")
        if [ "$UPLOAD" = true ]; then
          args+=(--upload)
        fi

        status=0
        docker "${args[@]}" || status=$?
        if docker cp "$name:/tmp/appsec-scanner/$SARIF_OUTPUT" "$out_dir/$SARIF_OUTPUT" > /dev/null 2>&1; then
          echo "sarif-file=$out_dir/$SARIF_OUTPUT" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
