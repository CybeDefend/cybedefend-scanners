rules:
  - id: python-eval
    languages: [python]
    severity: ERROR
    message: >-
      eval() runs its argument as Python code. A value that is not a constant
      string lets whoever controls it run arbitrary code in this process.
      Parse the data instead (json.loads, ast.literal_eval for literals, or an
      explicit mapping of allowed operations).
    patterns:
      - pattern: eval($CODE, ...)
      - pattern-not: eval("...", ...)
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      category: security
      confidence: MEDIUM
      security-severity: "9.8"
      license: Apache-2.0
