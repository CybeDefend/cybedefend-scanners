# Deliberately vulnerable sample for the zizmor adapter's tests: do not copy
# it into a real repository. It lives under testdata/, so GitHub never runs it.
#
# - `pull_request_target` runs with the base repository's secrets and token,
#   and the checkout below then runs the fork's code with them
#   (zizmor: dangerous-triggers).
# - The pull request title is expanded into the shell script before it runs
#   (zizmor: template-injection).
name: triage

on: pull_request_target

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: echo "${{ github.event.pull_request.title }}"
