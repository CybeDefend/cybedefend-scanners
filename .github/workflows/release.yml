name: Release

# Runs only when a maintainer pushes a vMAJOR.MINOR.PATCH tag. For each adapter it
# builds the image for linux/amd64, runs that adapter's integration tests on
# it, then pushes ghcr.io/cybedefend/appsec-scanners-<adapter> for linux/amd64
# and linux/arm64 under :<version>, :<major> and :latest (<version> is the tag
# without its leading v). Once the six images are pushed, it creates the GitHub
# release with their digests.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Each job asks for its own permissions.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - adapter: opengrep
            tests: '^TestOpengrep'
          - adapter: gitleaks
            tests: '^TestGitleaks'
          - adapter: trivy-config
            tests: '^TestTrivyConfig'
          - adapter: zizmor
            tests: '^TestZizmor'
          - adapter: trivy-fs
            tests: '^TestTrivyFs'
          - adapter: trivy-image
            tests: '^TestTrivyImage'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Version
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.adapter }}/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: appsec-scanners-${{ matrix.adapter }}:dev
          load: 'true'

      - name: Integration tests on the amd64 image
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 -tags integration -run "$TESTS" ./test/integration/...

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.adapter }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/cybedefend/appsec-scanners-${{ matrix.adapter }}:${{ steps.meta.outputs.version }}
            ghcr.io/cybedefend/appsec-scanners-${{ matrix.adapter }}:${{ steps.meta.outputs.major }}
            ghcr.io/cybedefend/appsec-scanners-${{ matrix.adapter }}:latest
          push: 'true'

      - name: Record the digest
        env:
          ADAPTER: ${{ matrix.adapter }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the push gave no digest for $ADAPTER"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ADAPTER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.adapter }}
          path: ${{ runner.temp }}/digests/${{ matrix.adapter }}
          if-no-files-found: error
          retention-days: '1'

  release:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: 'true'
          path: ${{ runner.temp }}/digests

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Images for linux/amd64 and linux/arm64, also tagged :${version%%.*} and :latest."
            echo
            echo "| Adapter | Image | Digest |"
            echo "|---|---|---|"
            for a in opengrep gitleaks trivy-config zizmor trivy-fs trivy-image; do
              digest="$(cat "$RUNNER_TEMP/digests/$a")"
              echo "| \`$a\` | \`ghcr.io/cybedefend/appsec-scanners-$a:$version\` | \`$digest\` |"
            done
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$notes"
