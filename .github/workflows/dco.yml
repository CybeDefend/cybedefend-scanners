name: DCO

on:
  pull_request:

permissions:
  contents: read

# A new push to the same ref cancels the runs of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
      - name: Every commit is signed off
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          git log --no-merges --format='%H%x00%B%x1e' "origin/${BASE_REF}..HEAD" | go run ./cmd/dco-check
