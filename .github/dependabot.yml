# Update pull requests for every pin: the actions (by commit sha), the base
# images of each Dockerfile (by digest) and the Go modules. One pull request
# per ecosystem, so a pin shared by several images moves in all of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /images/gitleaks
      - /images/opengrep
      - /images/trivy-config
      - /images/trivy-fs
      - /images/trivy-image
      - /images/zizmor
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ['*']
    ignore:
      # A new Go minor or major moves go.mod, every setup-go and every
      # Dockerfile together, by hand. Go patch releases still come.
      - dependency-name: golang
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  # A deliberately vulnerable sample: the trivy-fs and trivy-image integration
  # tests expect its known vulnerability. Ignoring every dependency stops both
  # the version and the security update pull requests that would fix it.
  - package-ecosystem: npm
    directory: /testdata/samples/sca-npm
    schedule:
      interval: weekly
    groups:
      sample:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
